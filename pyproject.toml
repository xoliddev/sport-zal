[project]
name = "sport-zal"
version = "1.0.0"
description = "Gym for Uzbekistan: a Telegram Mini App for members (rotating check-in QR, live occupancy and the forecast, classes with a waitlist, freezing), a web admin panel for the desk and the owner, and a bot"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/*" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
